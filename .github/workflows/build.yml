name: Build AeroPKG (PS4 PKG)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld unzip

      - name: Setup OpenOrbis PS4 Toolchain
        run: |
          sudo mkdir -p /opt/openorbis
          echo "Downloading OpenOrbis PS4 Toolchain (LLVM-18)..."
          curl --fail --location --retry 3 \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" \
            | sudo tar -xz -C /opt/openorbis
          
          TOOLCHAIN_ROOT="/opt/openorbis/OpenOrbis/PS4Toolchain"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_ROOT" >> $GITHUB_ENV
          echo "OO_TOOLCHAIN=$TOOLCHAIN_ROOT" >> $GITHUB_ENV
          echo "$TOOLCHAIN_ROOT/bin/linux" >> $GITHUB_PATH

      - name: Download SQLite amalgamation
        run: |
          mkdir -p third_party/sqlite
          curl --fail --location --retry 3 \
            "https://www.sqlite.org/2024/sqlite-amalgamation-3450300.zip" \
            -o /tmp/sqlite.zip
          unzip -q /tmp/sqlite.zip -d /tmp
          cp /tmp/sqlite-amalgamation-3450300/sqlite3.c third_party/sqlite/
          cp /tmp/sqlite-amalgamation-3450300/sqlite3.h third_party/sqlite/

      - name: Compile and Package AeroPKG
        run: |
          make

      - name: Upload AeroPKG.pkg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroPKG-PS4
          path: |
            *.pkg
            eboot.bin
